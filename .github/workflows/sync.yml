name: Sync Withings to Garmin

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and run sync
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_CODE: ${{ secrets.WITHINGS_CODE }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install garth garminconnect withings-api requests setuptools
          python sync.pyThe error **`EOF when reading a line`** occurs because your Python script is attempting to read interactive user input (`input("Enter authorization code: ")`), but it is running in a **non-interactive headless environment** (like a GitHub Actions CI/CD runner). 

Because there is no active terminal or human user to type the code, the standard input (`stdin`) immediately hits an End-Of-File (EOF) and crashes.

---

### Root Cause
1. **Interactive Prompt in CI/CD:** The Withings OAuth2 authentication flow requires the user to manually visit a URL, retrieve an authorization code, and paste it back into the terminal prompt.
2. **Expired or Missing Refresh Token:** `withings-api` attempts to prompt for an authorization code only when it lacks a valid `refresh_token` stored in its configuration or state file.

---

### How to Fix It

#### Solution 1: Generate and Pass a Long-Lived Refresh Token
Instead of relying on interactive browser authentication during the automated pipeline run:

1. **Run the script locally once on your computer.**
2. Complete the OAuth flow manually in your local terminal.
3. Once authenticated, locate the output `refresh_token` generated by `withings-api`.
4. Add that `WITHINGS_REFRESH_TOKEN` as an **Environment Variable** or **Secret** in your CI/CD platform (e.g., GitHub Secrets).
5. Ensure your script initializes the `WithingsAuth` or `WithingsApi` client using the saved `refresh_token` so it bypasses the interactive browser login step.

#### Solution 2: Use non-interactive token refresh handling
Update your script setup to ensure it automatically refreshes tokens in non-interactive environments:

```python
from withings_api import WithingsApi, WithingsAuth

# Initialize using saved tokens rather than initiating a new OAuth code flow
auth = WithingsAuth(
    client_id=WITHINGS_CLIENT_ID,
    client_secret=WITHINGS_CLIENT_SECRET,
    refresh_token=SAVED_REFRESH_TOKEN,
)
credentials = auth.refresh()

client = WithingsApi(credentials)
